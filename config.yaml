paths:
  raw_dir: data/raw
  html_cache_dir: data/raw/html
  processed_dir: data/processed
  features_dir: data/features
  models_dir: models
  predictions_dir: outputs/predictions
  tracking_dir: outputs/tracking
  reviews_dir: outputs/reviews       # post-event reviews + evidence board (src/review.py)

http:
  base_url: http://ufcstats.com
  user_agent: "UFCFightPredictor/0.1 (DataScienceResearch; non-commercial)"
  min_interval_sec: 1.0     # max 1 request per second
  timeout_sec: 15
  max_attempts: 3
  backoff_base_sec: 2       # waits 2s, 4s between attempts
  host_min_interval_sec:    # stricter per-host limits (robots.txt crawl-delay)
    www.ufc.com: 15

source:
  repo: Greco1899/scrape_ufc_stats
  branch: main
  source_dir: data/raw/source
  overrides_file: ingest_overrides.csv
  files:
    - ufc_event_details
    - ufc_fight_results
    - ufc_fight_stats
    - ufc_fighter_details
    - ufc_fighter_tott

upcoming:
  manual_card_file: data/raw/upcoming_card.json
  cards_dir: data/raw/cards               # one JSON per scheduled card (written by the ufc.com fetch)
  aliases_file: upcoming_aliases.csv      # committed, verified card-name -> fighter_id fixes
  ufc_events_url: https://www.ufc.com/events
  ufc_base_url: https://www.ufc.com
  espn_scoreboard_url: https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard
  espn_cache_dir: data/raw/espn
  lookahead_days: 45

analytics:
  # GoatCounter site code (https://<code>.goatcounter.com): cookie-free visit counts for the
  # published dashboard (index.html only). Empty = no analytics script at all.
  goatcounter_code: ""

clean:
  min_date: "2005-01-01"

split:
  train_end: "2024-01-01"   # train: event_date < train_end
  valid_end: "2025-01-01"   # validate: train_end <= date < valid_end; test: >= valid_end

model:
  random_seed: 42
  logistic:
    C_grid: [0.01, 0.03, 0.1, 0.3, 1.0]   # chosen by validation log loss
  lightgbm:
    learning_rate: 0.02
    max_estimators: 3000                  # early stopping on validation picks the count
    early_stopping_rounds: 100
    grid:                                 # light tuning on validation log loss
      num_leaves: [7, 15, 31]
      min_child_samples: [20, 50, 100]
    fixed:
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.7
      reg_lambda: 1.0
  # Flag possible leakage if one feature has more than this share of total LightGBM gain.
  dominance_threshold: 0.25
  calibration_bins: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 1.0]   # favourite's probability
  promotion:                  # gates before a model may become models/latest.pkl
    run_tests: true           # full pytest suite must pass
    tests_timeout_sec: 900

# Walk-forward (rolling-origin) backtest. Each slice tunes on the last
# `inner_validation_years` before its cutoff, refits on everything before the cutoff
# (imputer included), and scores the test window.
backtest:
  inner_validation_years: 1
  slices:
    - {train_end: "2023-01-01", test_end: "2024-01-01"}
    - {train_end: "2024-01-01", test_end: "2025-01-01"}
    - {train_end: "2025-01-01", test_end: null}      # 2025 to latest
