paths:
  raw_dir: data/raw
  html_cache_dir: data/raw/html
  processed_dir: data/processed
  features_dir: data/features
  models_dir: models
  predictions_dir: outputs/predictions
  tracking_dir: outputs/tracking

http:
  base_url: http://ufcstats.com
  user_agent: "UFCFightPredictor/0.1 (DataScienceResearch; non-commercial)"
  min_interval_sec: 1.0     # max 1 request per second
  timeout_sec: 15
  max_attempts: 3
  backoff_base_sec: 2       # waits 2s, 4s between attempts

source:
  repo: Greco1899/scrape_ufc_stats
  branch: main
  source_dir: data/raw/source
  overrides_file: ingest_overrides.csv
  files:
    - ufc_event_details
    - ufc_fight_results
    - ufc_fight_stats
    - ufc_fighter_details
    - ufc_fighter_tott

upcoming:
  manual_card_file: data/raw/upcoming_card.json
  espn_scoreboard_url: https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard
  espn_cache_dir: data/raw/espn
  lookahead_days: 45

clean:
  min_date: "2005-01-01"

split:
  train_end: "2024-01-01"   # train: event_date < train_end
  valid_end: "2025-01-01"   # validate: train_end <= date < valid_end; test: >= valid_end

model:
  random_seed: 42
  logistic:
    C_grid: [0.01, 0.03, 0.1, 0.3, 1.0]   # chosen by validation log loss
  lightgbm:
    learning_rate: 0.02
    max_estimators: 3000                  # early stopping on validation picks the count
    early_stopping_rounds: 100
    grid:                                 # light tuning on validation log loss
      num_leaves: [7, 15, 31]
      min_child_samples: [20, 50, 100]
    fixed:
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.7
      reg_lambda: 1.0
  # Flag possible leakage if one feature has more than this share of total LightGBM gain.
  dominance_threshold: 0.25
  calibration_bins: [0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 1.0]
