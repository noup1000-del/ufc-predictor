# Publish the predictions dashboard (outputs/predictions/index.html + per-card pages)
# to GitHub Pages whenever new predictions are pushed to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy predictions to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "outputs/predictions/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, a running one finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "outputs/predictions"
      - id: deployment
        uses: actions/deploy-pages@v4
